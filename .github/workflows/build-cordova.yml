name: Build Cordova APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write  # Needed to delete releases and read/write release assets
      actions: read    # Needed to read workflow runs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova --no-audit --no-fund

      - name: Parse Payload & Prepare Project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAYLOAD='${{ github.event.inputs.payload }}'
          echo "Payload: $PAYLOAD"

          # Extract fields from JSON payload
          URL=$(echo "$PAYLOAD" | jq -r '.url // empty')
          ZIP_ASSET_URL=$(echo "$PAYLOAD" | jq -r '.zipAssetUrl // empty')
          ZIP_RELEASE_TAG=$(echo "$PAYLOAD" | jq -r '.zipReleaseTag // empty')
          APP_NAME=$(echo "$PAYLOAD" | jq -r '.appName // "MyApp"')
          BUILD_TYPE=$(echo "$PAYLOAD" | jq -r '.buildType // "release"')

          echo "URL=$URL"
          echo "ZIP_ASSET_URL=$ZIP_ASSET_URL"
          echo "APP_NAME=$APP_NAME"
          echo "BUILD_TYPE=$BUILD_TYPE"

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "ZIP_RELEASE_TAG=$ZIP_RELEASE_TAG" >> $GITHUB_ENV

          mkdir -p project

          # MODE 1: ZIP from GitHub Release Asset (ZIP to APK flow)
          if [ -n "$ZIP_ASSET_URL" ]; then
            echo "Mode: ZIP from GitHub Release Asset"
            curl -s -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "$ZIP_ASSET_URL" \
              -o project.zip
            echo "Downloaded ZIP from release asset"
            unzip -q project.zip -d project_extracted
            INNER=$(ls project_extracted/ | head -1)
            if [ -d "project_extracted/$INNER" ] && [ "$(ls project_extracted/ | wc -l)" = "1" ]; then
              mv "project_extracted/$INNER"/* project/ 2>/dev/null || mv "project_extracted/$INNER" project/src
            else
              mv project_extracted/* project/ 2>/dev/null || true
            fi
            rm -rf project_extracted project.zip

          # MODE 2: URL (URL to APK flow - expects a publicly downloadable Cordova project ZIP)
          elif [ -n "$URL" ]; then
            echo "Mode: URL to APK — $URL"
            wget -q -O project.zip "$URL"
            unzip -q project.zip -d project_extracted
            INNER=$(ls project_extracted/ | head -1)
            if [ -d "project_extracted/$INNER" ] && [ "$(ls project_extracted/ | wc -l)" = "1" ]; then
              mv "project_extracted/$INNER"/* project/ 2>/dev/null || true
            else
              mv project_extracted/* project/ 2>/dev/null || true
            fi
            rm -rf project_extracted project.zip

          else
            echo "ERROR: No URL or ZIP asset URL provided in payload"
            exit 1
          fi

          echo "Project files:"
          ls -la project/

      - name: Add Android Platform
        run: |
          cd project
          if [ -d "platforms/android" ]; then
            echo "android platform already present"
          else
            cordova platform add android --no-telemetry
          fi

      - name: Prepare Cordova Project
        run: |
          cd project
          cordova prepare android --no-telemetry

      - name: Build Cordova APK
        run: |
          cd project
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties

          if [ "$BUILD_TYPE" = "debug" ]; then
            cordova build android --debug --no-telemetry
          else
            cordova build android --release --no-telemetry
          fi

      - name: Find APK File
        id: find_apk
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_PATH=$(find project/platforms/android -name "*debug*.apk" -type f 2>/dev/null | head -1)
          else
            APK_PATH=$(find project/platforms/android -name "*release*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find project/platforms/android -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file found after build"
            find project/platforms/android -type f -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup Release Asset
        if: always() && env.ZIP_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$ZIP_RELEASE_TAG" ]; then
            echo "Cleaning up temporary release: $ZIP_RELEASE_TAG"
            gh release delete "$ZIP_RELEASE_TAG" --yes --repo ${{ github.repository }} 2>/dev/null || true
          fi
